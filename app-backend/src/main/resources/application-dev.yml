# ============================================
#  MÔI TRƯỜNG PHÁT TRIỂN (DEV / SANDBOX)
#  Dùng để test local với Ngrok + Sandbox MoMo/ZaloPay
# ============================================
spring:
  session:
    store-type: none
  cache:
    type: simple

server:
  port: 3000

# ============================================
#  CẤU HÌNH JWT & FIREBASE
# ============================================
app:
  seed:
    enabled: "${APP_SEED_ENABLED:false}"
  firebase:
    database-url: "${FIREBASE_DATABASE_URL:https://vua-vui-ve-default-rtdb.firebaseio.com}"
    config-path: "${FIREBASE_CONFIG_PATH:file:./serviceAccountKey.json}"
  jwt:
    secret: "${JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me}"
    access-token-expiration-ms: 86400000       # 24 giờ
    refresh-token-expiration-ms: 2592000000  # 30 ngày

# ============================================
#  CẤU HÌNH THANH TOÁN (SANDBOX)
# ============================================
  payment:
    momo:
      partner-code: "${MOMO_PARTNER_CODE:MOMO}"
      access-key: "${MOMO_ACCESS_KEY:}"
      secret-key: "${MOMO_SECRET_KEY:}"
      endpoint: "${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}"
      redirect-url: "${MOMO_REDIRECT_URL:http://127.0.0.1:3000/api/payments/momo/return}"
      ipn-url: "${MOMO_IPN_URL:http://127.0.0.1:3000/api/payments/momo/ipn}"
      request-type: "${MOMO_REQUEST_TYPE:captureWallet}"
      lang: "${MOMO_LANG:vi}"
      mock-mode: "${MOCK_MOMO_MODE:true}"
      allow-mock-result: "${MOMO_ALLOW_MOCK_RESULT:true}"

    zalopay:
      app-id: "${ZALOPAY_APP_ID:}"
      key1: "${ZALOPAY_KEY1:}"
      key2: "${ZALOPAY_KEY2:}"
      endpoint: "${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}"
      query-endpoint: "${ZALOPAY_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query}"
      callback-url: "${PUBLIC_BASE_URL:http://127.0.0.1:3000}/api/payments/zalopay/callback"
      redirect-url: "${PUBLIC_BASE_URL:http://127.0.0.1:3000}/api/payments/zalopay/return"
      mock-mode: "${ZALOPAY_MOCK_MODE:true}"

# ============================================
#  CẤU HÌNH CLOUDINARY (Lưu trữ ảnh)
# ============================================
  cloudinary:
    cloud-name: "${CLOUDINARY_CLOUD_NAME:}"
    api-key: "${CLOUDINARY_API_KEY:}"
    api-secret: "${CLOUDINARY_API_SECRET:}"

# ============================================
#  CẤU HÌNH GOOGLE GEMINI AI (Chatbot)
# ============================================
  gemini:
    api-key: "${GEMINI_API_KEY:}"
    model: "${GEMINI_MODEL:gemini-flash-lite-latest}"

# ============================================
#  CẤU HÌNH TỰ ĐỘNG HỦY ĐƠN (Cron Job)
# ============================================
  order:
    auto-cancel-minutes: 15  # Hủy đơn chưa thanh toán sau 15 phút

# ============================================
#  CẤU HÌNH TELEGRAM BOT
# ============================================
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

# ============================================
#  CẤU HÌNH RESEND EMAIL
# ============================================
  resend:
    api-key: ${RESEND_API_KEY:}

logging:
  level:
    vn.vuavuive: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.transaction: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
