      ipn-url: "${MOMO_IPN_URL:http://10.0.2.2:3000/api/momo/ipn}"
      request-type: "${MOMO_REQUEST_TYPE:captureWallet}"
      lang: "${MOMO_LANG:vi}"
      mock-mode: "${MOCK_MOMO_MODE:true}"

