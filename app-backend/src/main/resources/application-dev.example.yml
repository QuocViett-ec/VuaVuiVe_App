# ============================================
#  MÔI TRƯỜNG PHÁT TRIỂN (DEV / SANDBOX) - EXAMPLE TEMPLATE
#  Copy file này thành application-dev.yml và điền thông tin của bạn.
# ============================================
spring:
  session:
    store-type: none
  cache:
    type: simple
  datasource:
    url: jdbc:postgresql://localhost:5432/vuavuive_app
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: YOUR_DATABASE_PASSWORD
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 3000

# ============================================
#  CẤU HÌNH JWT
# ============================================
app:
  jwt:
    secret: "YOUR_JWT_SUPER_SECRET_KEY_MIN_256BIT"
    access-token-expiration-ms: 900000       # 15 phút
    refresh-token-expiration-ms: 2592000000  # 30 ngày

# ============================================
#  CẤU HÌNH THANH TOÁN (SANDBOX)
# ============================================
  payment:
    vnpay:
      tmn-code: "YOUR_VNPAY_TMN_CODE"
      secret-key: "YOUR_VNPAY_SECRET_KEY"
      pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      return-url: "https://localhost:3000/api/payments/vnpay/return"
      ipn-url: "https://localhost:3000/api/payments/vnpay/ipn"

    momo:
      partner-code: "YOUR_MOMO_PARTNER_CODE"
      access-key: "YOUR_MOMO_ACCESS_KEY"
      secret-key: "YOUR_MOMO_SECRET_KEY"
      endpoint: "https://test-payment.momo.vn/v2/gateway/api/create"
      redirect-url: "http://10.0.2.2:3000/api/momo/return"
      ipn-url: "http://10.0.2.2:3000/api/momo/ipn"
      request-type: "captureWallet"
      lang: "vi"
      mock-mode: "true"

# ============================================
#  CẤU HÌNH CLOUDINARY (Lưu trữ ảnh)
# ============================================
  cloudinary:
    cloud-name: "YOUR_CLOUDINARY_CLOUD_NAME"
    api-key: "YOUR_CLOUDINARY_API_KEY"
    api-secret: "YOUR_CLOUDINARY_API_SECRET"

# ============================================
#  CẤU HÌNH GOOGLE GEMINI AI (Chatbot)
# ============================================
  gemini:
    api-key: "YOUR_GEMINI_API_KEY"
    model: "gemini-1.5-flash"

# ============================================
#  CẤU HÌNH TỰ ĐỘNG HỦY ĐƠN (Cron Job)
# ============================================
  order:
    auto-cancel-minutes: 15

# ============================================
#  CẤU HÌNH TELEGRAM BOT
# ============================================
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    vn.vuavuive: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.transaction: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
