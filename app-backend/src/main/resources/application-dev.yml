# ============================================
#  MÔI TRƯỜNG PHÁT TRIỂN (DEV / SANDBOX)
#  Dùng để test local với Ngrok + Sandbox VNPay/MoMo
# ============================================
spring:
  session:
    store-type: none
  cache:
    type: simple
  datasource:
    url: jdbc:postgresql://localhost:5432/vuavuive_app
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Viet0609
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update       # Tu tao/cap nhat bang khi khoi dong
    show-sql: true           # In cau lenh SQL ra console de debug
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 3000


# ============================================
#  CẤU HÌNH JWT
# ============================================
app:
  jwt:
    secret: "vuavuive-super-secret-key-for-jwt-please-change-in-production-min-256bit"
    access-token-expiration-ms: 900000       # 15 phút
    refresh-token-expiration-ms: 2592000000  # 30 ngày

# ============================================
#  CẤU HÌNH THANH TOÁN (SANDBOX)
# ============================================
  payment:
    vnpay:
      tmn-code: "TFQUUGXU"        # <<< ĐỔI THÀNH MÃ SANDBOX CỦA BẠN
      secret-key: "V5IY2EZ98VHA6Q2P39VYMA7VJFK6DR6F"   # <<< ĐỔI THÀNH KEY SANDBOX
      pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      return-url: "https://lowell-intercerebral-monopodially.ngrok-free.app/api/payments/vnpay/return"
      ipn-url: "https://lowell-intercerebral-monopodially.ngrok-free.app/api/payments/vnpay/ipn"

    momo:
      partner-code: "${MOMO_PARTNER_CODE:MOMO}"
      access-key: "${MOMO_ACCESS_KEY:}"
