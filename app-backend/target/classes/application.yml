# ============================================
# Cấu hình mặc định (active: dev khi chạy local)
# ============================================
spring:
  profiles:
    active: dev

# ============================================
# Cấu hình Swagger / OpenAPI
# ============================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /api-docs
